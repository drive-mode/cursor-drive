  </defs>
  <!-- Car outline (black) -->
  <path d="M22 52 L22 42 L28 38 L38 36 L52 34 L68 36 L78 40 L92 38 L98 42 L102 48 L100 52 L96 54 L92 52 L88 56 L78 56 L72 52 L58 54 L42 54 L32 56 L24 54 Z" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
