name: Promote develop → master

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type (patch, minor, major, or none)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run compile
      - run: npm test

      - name: Version bump
        if: inputs.version_bump != 'none'
        run: |
          npm version ${{ inputs.version_bump }} --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version (${{ inputs.version_bump }})"
          git push origin develop

      - name: Create PR develop → master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh pr create \
            --base master \
            --head develop \
            --title "Release v${VERSION}: promote develop → master" \
            --body "Automated promotion from develop to master.

          **Version:** ${VERSION}
          **Bump:** ${{ inputs.version_bump }}

          Merge this PR to release." \
            --label "release" \
            || echo "PR already exists"
